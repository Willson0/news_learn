# Вариант для сервера, где 80/443 уже занимает nginx: контейнер слушает
# только локальный порт (по умолчанию 127.0.0.1:8095), HTTPS делает nginx.
# Запуск: docker compose -f deploy/docker-compose.nginx.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: ":80"
    ports:
      - "127.0.0.1:${APP_PORT:-8095}:80"
    volumes:
      - db:/app/backend/database/data
      - storage:/app/backend/storage
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  storage:
  caddy_data:
  caddy_config:
