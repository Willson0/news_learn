# Блок nginx для домена за обратным прокси. Сертификат — существующий от certbot.
server {
    listen 443 ssl;
    server_name wilflw.ru;
    client_max_body_size 50M;
    ssl_certificate /etc/letsencrypt/live/wilflw.ru-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wilflw.ru-0001/privkey.pem; # managed by Certbot

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
