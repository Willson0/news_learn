# Запуск: из корня репозитория
#   cp deploy/.env.example deploy/.env   # и заполнить
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - db:/app/backend/database/data
      - storage:/app/backend/storage
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  storage:
  caddy_data:
  caddy_config:
