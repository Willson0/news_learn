name: iOS CI

on:
  push:
    branches: [main, ios, "claude/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    # macos-15 несёт несколько Xcode; выбираем Xcode 26 — он даёт SDK iOS 26
    # с настоящим Liquid Glass (.glassEffect). Код под iOS 26 закрыт
    # #if compiler(>=6.2) + #available(iOS 26.0, *); при более старом Xcode
    # собирается только запасной вид, но тогда настоящее стекло не проверить,
    # поэтому если Xcode 26 нет — падаем с понятной ошибкой.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (SDK iOS 26 / Liquid Glass)
        run: |
          set -e
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Xcode 26 не найден на раннере — SDK iOS 26 недоступен, настоящее Liquid Glass не собрать."
            echo "Доступные Xcode:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "Выбран $XC"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project KartaLikvidnosti.xcodeproj \
            -scheme KartaLikvidnosti \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log || {
              echo "::group::Swift compile errors"
              grep -E "error:|warning:" build.log || true
              echo "::endgroup::"
              exit 1
            }
