name: Android UI screenshots

# Снимки плашек (календарь, тост, диалог) на эмуляторе Android 14: проверка, что
# размытие лежит только под плашкой. PNG — в артефакте «ui-screenshots».
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-ui.yml"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build test APKs
        run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - name: Run screenshot tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: bash ../.github/scripts/android-ui-shots.sh

      - name: Print screenshots (уменьшенные, base64 в лог)
        if: always()
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, glob
          from PIL import Image
          for f in sorted(glob.glob("shots/*.png")):
              im = Image.open(f).convert("RGB")
              im = im.resize((im.width * 2 // 5, im.height * 2 // 5), Image.LANCZOS)
              buf = io.BytesIO(); im.save(buf, "JPEG", quality=82)
              print(f"=====SHOT {f} {im.width}x{im.height}=====")
              print(base64.b64encode(buf.getvalue()).decode())
              print("=====END=====")
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: android/shots/
          if-no-files-found: warn
